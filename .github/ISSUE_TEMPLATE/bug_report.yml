name: Bug report
description: Report a reproducible failure in UrbanGauge tooling or UI.
title: "[Bug] "
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone or task ID
      description: Use an Mxx-Tyy identifier if known.
      placeholder: M01-T04
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include exact commands or navigation steps, with secrets and private data redacted.
      placeholder: "1. Run ...\n2. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and verification
      description: OS, runtime versions, commit SHA, and relevant test output without source-data uploads.
    validations:
      required: false
