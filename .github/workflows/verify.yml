name: Verify milestone (manual)

# Intentionally manual: no push, pull_request, release, schedule or deployment triggers.
# This verifies a selected ref only after a human starts workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Python regressions and publication policy checks
        run: python -m unittest discover -s tests -v
      - name: Check generated roadmap (do not rewrite)
        run: python scripts/sync_roadmap.py --check
      - name: Verify docs-as-code and manual execution policy
        run: python scripts/validate_m01_docs.py
      - name: Review offline security contract without publishing
        run: python scripts/validate_m01_security.py
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.34.9'
          run_install: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install pinned frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Next.js route types
        run: pnpm --dir frontend typegen
      - name: Check strict TypeScript
        run: pnpm --dir frontend typecheck
      - name: Build project-subpath static frontend (not deploy)
        env:
          NEXT_PUBLIC_BASE_PATH: /UrbanGauge
        run: pnpm --dir frontend build
      - name: Check exported deep links and static assets on loopback only
        run: python scripts/validate_m01_static_export.py --smoke --base-path /UrbanGauge
      - name: Require static output without publishing
        run: test -s frontend/out/index.html
